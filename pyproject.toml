[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authkit"
version = "0.1.0"
description = "A small standard-library authentication utility (password hashing, user store, session tokens)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dabnn", email = "dabnny@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
authkit = "authkit.login:main"

[tool.hatch.build.targets.wheel]
packages = ["src/authkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
